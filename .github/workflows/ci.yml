# Type check, lint, unit tests, and end-to-end tests.
#
# This did not exist until now, which is worth stating plainly rather than
# leaving as an absence: the test suite had only ever run on one developer's
# machine, and `docker-publish.yml` pushed an image to GHCR on every merge to
# main with nothing gating it. That workflow now depends on this one.
#
# Node 24 throughout every workflow. Node 20 reached end of life in April 2026,
# and Capacitor 8's CLI requires Node 22 or newer even when a workflow only
# invokes a plain repository script: `npm ci` validates every package's engine
# before that script gets a chance to run.
#
# For this to actually block a merge it has to be marked "required" in the
# repo's branch protection settings for main (Settings > Branches). That is a
# GitHub setting, not something this file can express — the same caveat
# validate-ring.yml carries.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Callable so docker-publish.yml can gate on it. `needs:` only works
  # between jobs in one workflow file, so a reusable workflow is the
  # mechanism that actually makes the publish depend on this passing.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Ring data first: it is the cheapest check here and the only one whose
      # failure means the artifact would ship wrong data rather than wrong code.
      #
      # This repo no longer authors ring.json -- members/*.json and the
      # schemas live in indienodes-ring now (see docs/decisions.md, "LOCKED:
      # ring.json is a versioned envelope, and the ring is being split into
      # its own repository"). What's committed here is a mirror, refreshed by
      # sync-ring-mirror.mjs on repository_dispatch from that repo publishing
      # a change. This step only checks that the committed mirror is
      # currently well-formed -- deliberately no network call to
      # ring.indienodes.us here, so this repo's own CI reliability on every
      # push and PR does not depend on that endpoint's uptime at that moment.
      # docker-publish.yml gates its build on this workflow, so a malformed
      # mirror fails here and no image is published.
      - name: Ring data
        run: npm run ring:validate

      - name: Platform metadata
        run: npm run platforms:check

      - name: Type check
        run: npm run check

      - name: Lint and formatting
        run: npm run lint

      # Runs the generated n8n Code-node JS -- including the SSRF guard and
      # the Turnstile gates -- in an n8n-shaped sandbox. It needs python3
      # (the generator) and prettier, both already present on this runner.
      # Deliberately NOT `n8n:check`: drift against the live export is a
      # deploy-state question, and a generator change is legitimately ahead
      # of n8n until someone runs --push and --export.
      - name: n8n workflow code
        run: node scripts/n8n/test_code_nodes.mjs

      # Before the unit tests, not just the e2e ones: vitest's `client` project
      # runs the Svelte component tests in real Chromium via
      # @vitest/browser-playwright (see vite.config.js), so `npm run test:unit`
      # needs the browsers too. `--with-deps` adds the system libraries — a
      # bare `playwright install` fetches the binaries and then cannot launch
      # them.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Unit tests
        run: npm run test:unit -- --run

      # The 16 generator-template screenshots are excluded, not forgotten.
      # They are committed as `*-linux.png` and this runner is linux, but font
      # rasterisation still differs between machines, so they fail here for
      # reasons that have nothing to do with the code. A suite that goes red
      # for rendering reasons trains people to ignore it. Re-baselining them on
      # a runner and adding them back is worth doing; guessing that they will
      # pass is not.
      #
      # Everything else runs, across both Playwright projects.
      - name: End-to-end tests
        run: npx playwright test --grep-invert "reference image"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
