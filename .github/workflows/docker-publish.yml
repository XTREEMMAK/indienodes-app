# Builds and publishes the static-site image described in the Dockerfile.
# Structurally modeled on the sibling GGRequestz project's own publish
# workflow (buildx/QEMU/GHCR/metadata-action shape), trimmed of everything
# that was really about adapter-node: no .env.docker-build placeholder file,
# no PM2, no production-only npm install, no database migrations to copy in.
# This image has nothing to configure at deploy time beyond the build args
# below: nine VITE_ values baked into the client bundle, plus the two
# GATE_ values that install the pre-launch access gate
# (docs/pre-launch-gate.md) -- neither of those reaches the bundle, and
# only the password hash is an actual credential.
#
# That list must stay in step with the Dockerfile's own ARG block, which is
# the definitive set. It has now drifted behind it three times: once when
# Contact and Turnstile shipped in 0.11.0, again after v1.0 prep fixed the
# Dockerfile without fixing this file (no Turnstile control, no About-modal
# Support tab), and again when the rating prompt shipped in 7d603a7 with
# VITE_RATING_WEBHOOK_URL added to the Dockerfile but not here -- every
# image published in between quietly never asked anyone for a rating.

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      enable_gate:
        description: >-
          Build with the pre-launch access gate armed (GATE_USER /
          GATE_PASSWORD_HASH from repo config). Only meaningful on a manual
          run -- push-triggered builds (branch or tag) never read those
          regardless of this input, so a gated image only ever comes from a
          deliberate run here. See docs/pre-launch-gate.md.
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Runs the full check/lint/unit/e2e suite from ci.yml. Called rather than
  # duplicated, so there is one definition of "passing".
  #
  # On a pull request this means the suite runs twice: once as ci.yml's own
  # run (which is what branch protection marks required) and once here. That
  # is a known, accepted cost rather than an oversight — the alternative is
  # dropping this workflow's pull_request trigger, which would give up
  # catching a broken Dockerfile before merge, and a few CI minutes are
  # cheaper than that.
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    runs-on: ubuntu-latest
    # No image reaches the registry without that suite passing. Before this
    # existed, every merge to main published one unconditionally.
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Whether GATE_USER/GATE_PASSWORD_HASH are even read below -- see
      # docs/pre-launch-gate.md. Deliberately independent of whether those
      # repo vars/secrets are set: only a manual run with enable_gate checked
      # resolves true, so a push (branch or tag) can never inherit a gate left
      # armed from an earlier round of testing. Turning maintenance/widget
      # testing on for a specific ref is therefore always a conscious action
      # taken here, not ambient state that silently follows whatever gets
      # built next.
      - name: Resolve gate state
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.enable_gate }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record gate state in job summary
        run: |
          if [ "${{ steps.gate.outputs.enabled }}" = "true" ]; then
            echo "### 🔒 Pre-launch gate: ENABLED for this build" >> "$GITHUB_STEP_SUMMARY"
            echo "Triggered manually with enable_gate checked. This image requires HTTP basic auth on every route except the widget-serving paths (docs/pre-launch-gate.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🔓 Pre-launch gate: not enabled" >> "$GITHUB_STEP_SUMMARY"
            echo "This image ships ungated." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ vars.GATE_USER }}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Note: \`GATE_USER\` is set in repo config, but this run doesn't read it -- only a manual \`workflow_dispatch\` run with \`enable_gate\` checked builds gated." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SITE_ORIGIN=${{ vars.VITE_SITE_ORIGIN || 'https://app.indienodes.us' }}
            VITE_SUBMISSION_WEBHOOK_URL=${{ vars.VITE_SUBMISSION_WEBHOOK_URL }}
            VITE_CONTACT_WEBHOOK_URL=${{ vars.VITE_CONTACT_WEBHOOK_URL }}
            VITE_RATING_WEBHOOK_URL=${{ vars.VITE_RATING_WEBHOOK_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_KOFI_URL=${{ vars.VITE_KOFI_URL }}
            VITE_RING_REPO_URL=${{ vars.VITE_RING_REPO_URL }}
            VITE_RING_URL=${{ vars.VITE_RING_URL }}
            VITE_EARLY_ACCESS=${{ vars.VITE_EARLY_ACCESS }}
            GATE_USER=${{ steps.gate.outputs.enabled == 'true' && vars.GATE_USER || '' }}
            GATE_PASSWORD_HASH=${{ steps.gate.outputs.enabled == 'true' && secrets.GATE_PASSWORD_HASH || '' }}
          # Unset is a supported state for eight of the nine VITE_ values: no
          # submission webhook means a build reports submissions closed
          # rather than dropping them, no contact webhook does the same for
          # /contact, no rating webhook means the app never asks for a
          # rating at all (quieter than the forms' closed state, and
          # correct, since nobody is waiting on an answer), no Turnstile key
          # means the widget does not render, no Ko-fi URL drops the About
          # modal's Support tab and the rating prompt's support step, no
          # ring URL falls back to the app's own committed ring mirror, and
          # no VITE_EARLY_ACCESS means the site does not present itself as
          # being in its founding-ring phase.
          # Unset silently is the problem, which is why they are listed here
          # even when empty.
          #
          # VITE_EARLY_ACCESS is the only boolean here, and the only one whose
          # *intended* end state is unset: it is set to the string `true` for
          # the Early Access window and then removed to leave that phase, so
          # the status chip and the founding-ring copy come down together
          # without a code change or a release. Any other value, `false`
          # included, reads as off (src/lib/config.js compares against 'true'
          # exactly, since every VITE_ value arrives here as a string).
          #
          # These come from repository VARIABLES, and this workflow is the only
          # place they can enter: adapter-static compiles them into the bundle
          # here, so nothing on the deploy side -- Semaphore, Ansible, a vault,
          # a compose file -- can supply them later. `docker run -e` does
          # nothing. See docs/decisions.md, "The deployed artifact is the GHCR
          # image".
          #
          # The failure is quiet: with them unset the build succeeds and the
          # image serves, but every form in it reports itself closed. Checked
          # 2026-08-24, `gh variable list` was empty, so every image published
          # up to then had exactly that defect. If a published image's forms
          # say they are closed, check the variables before the code.
          #
          # All nine VITE_ values are compiled into the public client bundle,
          # not read at container runtime (see Dockerfile, src/lib/config.js)
          # — every one of them belongs in a repository VARIABLE, never a
          # secret. Filing one as a secret would suggest its exposure
          # matters, when every abuse control that actually protects
          # submission/contact/rating already lives server-side, not in
          # keeping these URLs hidden (see docs/decisions.md).
          #
          # GATE_USER / GATE_PASSWORD_HASH are the opposite case: not VITE_,
          # never reach the client bundle, and install the pre-launch access
          # gate (docs/pre-launch-gate.md) only when BOTH are non-empty AND
          # `steps.gate.outputs.enabled` resolved true above -- setting just
          # one repo value, like leaving both unset, still builds an ungated
          # image, and now so does *any* push-triggered build (branch or tag)
          # regardless of what the repo vars/secrets hold. GATE_PASSWORD_HASH
          # reads from `secrets.`, not `vars.`, because it is the one value in
          # this whole list that is an actual credential (a bcrypt hash,
          # generated with `caddy hash-password --algorithm bcrypt`, never a
          # plaintext password). It still ends up visible in `docker history`
          # on a gated image -- acceptable for a bcrypt hash on a temporary
          # gate, which is the other reason this takes a hash and not a
          # password; see docs/pre-launch-gate.md for the full reasoning and
          # how to keep even the hash out of image metadata via a BuildKit
          # secret.
          #
          # This gate wiring used to be unconditional: any push, including a
          # `v*` tag, built gated whenever the repo vars happened to be set,
          # with nothing to catch a testing round that was never turned back
          # off before the next release. Restructured so the repo vars/secrets
          # can be left set indefinitely without ever leaking into an ordinary
          # release -- producing a gated image (for any ref: a tag, `main`,
          # anything) now always requires a manual `workflow_dispatch` run
          # with `enable_gate` checked. See the "Resolve gate state" step
          # above and docs/pre-launch-gate.md, "Enabling it".
